services:
  - type: web
    name: israeli-open-books-submit
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - { key: PYTHON_VERSION, value: 3.12.3 }
      - { key: GITHUB_TOKEN, sync: false }
      - { key: GITHUB_REPO, sync: false }     # owner/repo
      - { key: ALLOWED_ORIGIN, sync: false }  # https://USER.github.io
      - { key: PAGES_URL, sync: false }       # https://USER.github.io/REPO
      - { key: REVIEW_REPO, sync: false }     # אופציונלי: owner/private-repo לבדיקות פרטיות
