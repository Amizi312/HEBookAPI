<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הוספת ספר למאגר</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@900&family=Heebo:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f2f4f0;--surface:#fbfcfa;--ink:#172026;--muted:#5b6770;--line:#cfd6d0;--accent:#1f3a93;--tab:#e8c547;--err:#a4161a;--ok:#166534;--ok-bg:#f0fdf4}
[data-theme="dark"]{--bg:#12181c;--surface:#1a2227;--ink:#e8eded;--muted:#9aa7ad;--line:#2d383e;--accent:#8fa8ff;--err:#ff8a80;--ok:#4ade80;--ok-bg:#052e16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181c;--surface:#1a2227;--ink:#e8eded;--muted:#9aa7ad;--line:#2d383e;--accent:#8fa8ff;--err:#ff8a80;--ok:#4ade80;--ok-bg:#052e16}}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 Heebo,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);transition:background .2s,color .2s}
a{color:var(--accent)} :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:24px 20px 60px}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.theme-btn{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:16px;cursor:pointer;color:var(--ink)}
h1{font:900 clamp(32px,6vw,46px)/1.15 'Frank Ruhl Libre',serif;margin:8px 0 10px}
.lead{color:var(--muted);margin:0 0 28px}
form{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px;position:relative;box-shadow:6px 6px 0 var(--line)}
form::before{content:"";position:absolute;top:-12px;inset-inline-start:24px;width:96px;height:22px;background:var(--tab);border-radius:4px 4px 0 0}
label{display:block;font-weight:700;margin:18px 0 4px}
label small{font-weight:400;color:var(--muted)}
input,textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
input[aria-invalid=true]{border-color:var(--err)}
input.is-valid{border-color:var(--ok);background:var(--ok-bg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ltr{direction:ltr;text-align:left}
.hint{color:var(--muted);font-size:14px;margin:3px 0 0}
.err{color:var(--err);font-size:14px;margin:3px 0 0;min-height:1em}
.ok-msg{color:var(--ok);font-size:14px;margin:3px 0 0;font-weight:500}
.optional{margin-top:28px;border-top:1px solid var(--line);padding-top:6px}
.optional h2{font-size:18px;margin:14px 0 0}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
button,.btn{font:inherit;font-weight:700;padding:11px 20px;border-radius:6px;border:2px solid var(--ink);background:none;color:var(--ink);cursor:pointer;text-decoration:none}
button.primary{background:var(--ink);color:var(--bg)}
button:disabled{opacity:.6;cursor:wait}
#msg{margin-top:16px}
#msg p{margin:0;font-size:16px}
.hp{position:absolute;inset-inline-start:-9999px}
.input-with-btn{display:flex;gap:10px}
.input-with-btn input{flex:1}
.action-btn{padding:10px 14px;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.cover-box{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.cover-box input[type=file]{width:auto;flex:1;min-width:200px;padding:8px}
#coverPreview{width:110px;height:auto;border:1px solid var(--line);border-radius:4px;box-shadow:3px 3px 0 var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{font-weight:500;font-size:15px;padding:5px 14px;border:2px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#scanner-modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.scanner-box{background:var(--surface);padding:24px;border-radius:8px;max-width:500px;width:100%;text-align:center}
#reader{width:100%;margin:16px 0;border-radius:6px;overflow:hidden}
@media (max-width:600px){.row{grid-template-columns:1fr}.input-with-btn{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <a href="./">← חזרה לקטלוג הספרים</a>
    <button class="theme-btn" id="themeBtn" aria-label="שינוי מצב תצוגה">🌙</button>
  </div>

  <h1>הוספת ספר למאגר</h1>
  <p class="lead">ארבעה שדות חובה וקצת פרטים נוספים אם יש לכם. בפלאפון אפשר גם לסרוק את הברקוד מהמצלמה.</p>

  <form id="f" novalidate autocomplete="off">
    <label for="isbn">ISBN <small>(13 ספרות בגב הספר מתחת לברקוד)</small></label>
    <div class="input-with-btn">
      <input id="isbn" class="ltr" inputmode="numeric" autocomplete="off" required placeholder="9789655747683">
      <button type="button" id="scanBtn" class="action-btn" hidden>📷 סרוק ברקוד</button>
    </div>
    <p class="err" id="e-isbn" role="alert"></p>

    <label for="title">שם הספר</label>
    <input id="title" required maxlength="200"><p class="err" id="e-title" role="alert"></p>

    <label for="authors">מחברים <small>(אם יש יותר מאחד, מפרידים בפסיק)</small></label>
    <input id="authors" required placeholder="ריק ריירדן, ניל גיימן"><p class="err" id="e-authors" role="alert"></p>

    <label for="cover">תמונת כריכה</label>
    <div class="cover-box">
      <input id="cover" type="file" accept="image/*">
      <img id="coverPreview" alt="תצוגה מקדימה של הכריכה" hidden>
    </div>
    <p class="hint">בפלאפון אפשר לצלם את הכריכה או לבחור תמונה מהגלריה.</p>
    <p class="err" id="e-cover" role="alert"></p>

    <div class="optional">
      <h2>פרטים נוספים <small style="font-weight:400;color:var(--muted)">(לא חובה)</small></h2>

    <label id="genres-label">ז'אנר <small>(בחרו אחד או יותר, עד 5)</small></label>
    <div id="genreChips" class="chips" role="group" aria-labelledby="genres-label"></div>
    <div class="input-with-btn" style="margin-top:10px">
      <input id="genreOther" maxlength="40" placeholder="ז'אנר אחר? הקלידו והוסיפו">
      <button type="button" id="genreAdd" class="action-btn">הוספה</button>
    </div>
    <p class="err" id="e-genres" role="alert"></p>
      <div class="row">
        <div><label for="publisher">הוצאה לאור</label><input id="publisher" maxlength="100" placeholder="כנרת, זמורה-ביתן, דביר"></div>
        <div><label for="year">שנת הוצאה</label><input id="year" class="ltr" inputmode="numeric" maxlength="4" placeholder="2023"><p class="err" id="e-year" role="alert"></p></div>
      </div>
      <div class="row">
        <div><label for="series">סדרה</label><input id="series" maxlength="100" placeholder="פרסי ג'קסון והאולימפיים"></div>
        <div><label for="series_number">מספר בסדרה</label><input id="series_number" class="ltr" inputmode="numeric" maxlength="3" placeholder="1"></div>
      </div>
      <label for="summary">תקציר</label>
      <textarea id="summary" rows="3" maxlength="800" placeholder="תקציר קצר של עלילת הספר..."></textarea>
    </div>

    <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="btns">
      <button type="submit" class="primary" id="submitBtn">הוספה למאגר</button>
    </div>
    <div id="msg" role="status"></div>
  </form>
</div>

<div id="scanner-modal" hidden>
  <div class="scanner-box">
    <h3>סריקת ברקוד מהמצלמה</h3>
    <p style="color:var(--muted); font-size:14px;">כוון את המצלמה לברקוד בגב הספר</p>
    <div id="reader"></div>
    <button type="button" id="closeScannerBtn" class="btn" style="margin-top:10px;">ביטול וסגירה</button>
  </div>
</div>

<script>
// כתובת ה-Worker מ-Cloudflare (בלי / בסוף). להחליף אחרי היצירה:
const API_URL = 'https://REPLACE-ME.workers.dev';

const $ = id => document.getElementById(id);

// --- מצב תצוגה ---
const themeBtn = $('themeBtn');
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('theme', theme); } catch (e) {}
  themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
}
let savedTheme = null;
try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
setTheme(savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
themeBtn.addEventListener('click', () => {
  setTheme((document.documentElement.getAttribute('data-theme') || 'light') === 'dark' ? 'light' : 'dark');
});

// --- כפתור סריקה: רק במכשיר מגע עם מצלמה ---
const isTouchDevice = window.matchMedia('(pointer:coarse)').matches;
const hasCamera = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
if (isTouchDevice && hasCamera) $('scanBtn').hidden = false;

// --- ISBN ---
function isbn13Ok(s) {
  s = s.replace(/[-\s]/g, '');
  if (!/^\d{13}$/.test(s)) return false;
  let sum = 0;
  for (let i = 0; i < 12; i++) sum += parseInt(s[i], 10) * (i % 2 === 0 ? 1 : 3);
  return (10 - (sum % 10)) % 10 === parseInt(s[12], 10);
}

function checkIsbn() {
  const raw = $('isbn').value.replace(/[-\s]/g, '');
  const err = $('e-isbn');
  $('isbn').removeAttribute('aria-invalid');
  if (!raw) { $('isbn').className = 'ltr'; err.textContent = ''; return false; }
  if (isbn13Ok(raw)) {
    $('isbn').className = 'ltr is-valid';
    err.className = 'ok-msg';
    err.textContent = '✓ מספר ISBN תקין';
    return true;
  }
  $('isbn').className = 'ltr';
  $('isbn').setAttribute('aria-invalid', 'true');
  err.className = 'err';
  err.textContent = raw.length === 13 ? 'ספרת הביקורת שגויה' : `דרושות 13 ספרות (הוזנו ${raw.length})`;
  return false;
}
$('isbn').addEventListener('input', checkIsbn);

// --- תמונת כריכה: הקטנה לפני ההעלאה (השרת ימיר ל-WebP) ---
let coverBlob = null;

function toJpegBlob(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1000;
      const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale);
      c.height = Math.round(img.naturalHeight * scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('המרת התמונה נכשלה')), 'image/jpeg', 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('לא ניתן לקרוא את התמונה')); };
    img.src = url;
  });
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = () => reject(new Error('קריאת התמונה נכשלה'));
    r.readAsDataURL(blob);
  });
}

function resetPreview() {
  const old = $('coverPreview').src;
  if (old && old.startsWith('blob:')) URL.revokeObjectURL(old);
  $('coverPreview').removeAttribute('src');
  $('coverPreview').hidden = true;
}

$('cover').addEventListener('change', async () => {
  const file = $('cover').files[0];
  coverBlob = null;
  resetPreview();
  $('e-cover').textContent = '';
  if (!file) return;
  if (!file.type.startsWith('image/')) { $('e-cover').textContent = 'יש לבחור קובץ תמונה'; return; }
  try {
    coverBlob = await toJpegBlob(file);
    $('coverPreview').src = URL.createObjectURL(coverBlob);
    $('coverPreview').hidden = false;
  } catch (e) {
    $('e-cover').textContent = e.message;
  }
});

// --- סורק ברקוד ---
let html5QrcodeScanner = null;

$('scanBtn').addEventListener('click', () => {
  if (typeof Html5Qrcode === 'undefined') {
    alert('ספריית הסריקה לא נטענה. בדוק חיבור לאינטרנט ורענן את הדף.');
    return;
  }
  $('scanner-modal').hidden = false;
  html5QrcodeScanner = new Html5Qrcode("reader");
  html5QrcodeScanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    (decodedText) => {
      const clean = decodedText.replace(/[-\s]/g, '');
      if (/^\d{13}$/.test(clean)) {
        $('isbn').value = clean;
        checkIsbn();
        stopScanner();
      }
    },
    () => {}
  ).catch(() => {
    alert("לא ניתן לגשת למצלמה. ודא שאישרת הרשאות מצלמה בדפדפן.");
    stopScanner();
  });
});

function stopScanner() {
  $('scanner-modal').hidden = true;
  if (html5QrcodeScanner) {
    const scanner = html5QrcodeScanner;
    html5QrcodeScanner = null;
    scanner.stop().then(() => scanner.clear()).catch(() => {});
  }
}
$('closeScannerBtn').addEventListener('click', stopScanner);

// --- ז'אנרים ---
const MAX_GENRES = 5;
const selectedGenres = new Set();
let genreOptions = ['פרוזה', 'קומדיה רומנטית', 'רומנטזי', 'נוער', 'פנטזיה', 'מיתולוגיה יוונית', 'דיסטופיה', 'מדע בדיוני', 'מתח'];

function renderGenres() {
  const all = [...new Set([...genreOptions, ...selectedGenres])];
  $('genreChips').replaceChildren(...all.map(g => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = g;
    b.setAttribute('aria-pressed', selectedGenres.has(g) ? 'true' : 'false');
    b.addEventListener('click', () => toggleGenre(g));
    return b;
  }));
}

function toggleGenre(g) {
  $('e-genres').textContent = '';
  if (selectedGenres.has(g)) selectedGenres.delete(g);
  else if (selectedGenres.size >= MAX_GENRES) {
    $('e-genres').className = 'err';
    $('e-genres').textContent = `אפשר לבחור עד ${MAX_GENRES} ז'אנרים`;
    return;
  } else selectedGenres.add(g);
  renderGenres();
}

function addCustomGenre() {
  const g = $('genreOther').value.replace(/\s+/g, ' ').trim().slice(0, 40);
  if (!g) return;
  const existing = [...new Set([...genreOptions, ...selectedGenres])].find(x => x.toLowerCase() === g.toLowerCase());
  const name = existing || g;
  if (!existing) genreOptions.push(name);
  $('genreOther').value = '';
  if (!selectedGenres.has(name)) toggleGenre(name); else renderGenres();
}
$('genreAdd').addEventListener('click', addCustomGenre);
$('genreOther').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCustomGenre(); } });
renderGenres();

// מושכים את הז'אנרים הנפוצים מהקטלוג עצמו, כדי שהשמות יהיו אחידים
fetch('books.json').then(r => r.ok ? r.json() : Promise.reject()).then(data => {
  const count = {};
  (data.books || []).forEach(b => (b.genres || []).forEach(g => { count[g] = (count[g] || 0) + 1; }));
  const top = Object.keys(count).sort((a, b) => count[b] - count[a]).slice(0, 14);
  if (top.length) { genreOptions = top; renderGenres(); }
}).catch(() => {});

// --- ולידציה ---
function buildPayload() {
  ['e-title', 'e-authors', 'e-genres', 'e-cover', 'e-year'].forEach(id => $(id).textContent = '');
  let firstBad = null;
  const fail = (errId, text, fieldId) => {
    $(errId).className = 'err';
    $(errId).textContent = text;
    if (!firstBad) firstBad = fieldId;
  };

  const isbn = $('isbn').value.replace(/[-\s]/g, '');
  if (!isbn13Ok(isbn)) {
    checkIsbn();
    if (!$('e-isbn').textContent) $('e-isbn').textContent = 'יש להזין ISBN תקין';
    $('e-isbn').className = 'err';
    firstBad = 'isbn';
  }

  const title = $('title').value.trim();
  if (!title) fail('e-title', 'שם הספר הוא שדה חובה', 'title');

  const authors = $('authors').value.split(/[,،;\n]/).map(s => s.trim()).filter(Boolean);
  if (!authors.length) fail('e-authors', 'יש להזין לפחות מחבר אחד', 'authors');

  if (!coverBlob) fail('e-cover', 'יש להוסיף תמונת כריכה', 'cover');

  const yearRaw = $('year').value.trim();
  let year = null;
  if (yearRaw) {
    year = parseInt(yearRaw, 10);
    if (!year || year < 1400 || year > 2100) fail('e-year', 'שנת הוצאה אינה תקינה', 'year');
  }

  if (firstBad) { $(firstBad).focus(); throw new Error('validation'); }

  // שדות ריקים פשוט לא נשלחים
  const book = { isbn, title, authors, language: 'he' };
  if (selectedGenres.size) book.genres = [...selectedGenres];
  const publisher = $('publisher').value.trim();
  if (publisher) book.publisher = publisher;
  if (year) book.publication_year = year;
  const series = $('series').value.trim();
  if (series) {
    book.series = series;
    const n = parseInt($('series_number').value.trim(), 10);
    if (!isNaN(n) && n > 0) book.series_number = n;
  }
  const summary = $('summary').value.trim();
  if (summary) book.summary = summary;
  return book;
}

function showMsg(text, ok) {
  const p = document.createElement('p');
  p.className = ok ? 'ok-msg' : 'err';
  p.textContent = text;
  $('msg').replaceChildren(p);
}

function resetForm() {
  $('f').reset();
  selectedGenres.clear();
  renderGenres();
  $('e-genres').textContent = '';
  coverBlob = null;
  resetPreview();
  $('isbn').className = 'ltr';
  $('isbn').removeAttribute('aria-invalid');
  $('e-isbn').textContent = '';
}

// ריענון או חזרה לדף: מנקים את הטופס (הדפדפן משחזר שדות מהביקור הקודם)
window.addEventListener('pageshow', () => { resetForm(); $('msg').replaceChildren(); });

// --- שליחה לשרת ---
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('msg').replaceChildren();

  if ($('website').value) { showMsg('✓ הספר נוסף למאגר!', true); return; } // honeypot

  let book;
  try { book = buildPayload(); }
  catch (err) { if (err.message !== 'validation') showMsg(err.message, false); return; }

  if (API_URL.includes('REPLACE-ME')) {
    showMsg('השליחה עדיין לא הוגדרה באתר (חסרה כתובת שרת).', false);
    return;
  }

  const btn = $('submitBtn');
  btn.disabled = true;
  btn.textContent = '⏳ שולח...';
  try {
    const cover = await blobToBase64(coverBlob);
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...book, cover, cover_rights: true, website: '' })
    });
    const out = await res.json().catch(() => ({}));
    if (res.ok) {
      resetForm();
      showMsg('✓ הספר נוסף למאגר! הוא יופיע בקטלוג תוך דקה או שתיים.', true);
    } else {
      showMsg(out.message || 'אירעה שגיאה. נסו שוב מאוחר יותר.', false);
    }
  } catch (err) {
    showMsg('לא ניתן להתחבר לשרת. בדקו את החיבור ונסו שוב.', false);
  } finally {
    btn.disabled = false;
    btn.textContent = 'הוספה למאגר';
  }
});
</script>
</body>
</html>
