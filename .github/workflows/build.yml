name: validate-and-build
on:
  pull_request:
    paths: ["books/**", "covers/**", "scripts/**"]
  push:
    branches: [main]
    paths: ["books/**", "covers/**", "scripts/**"]
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: המרת כריכות חדשות ל-WebP
        run: |
          pip install pillow
          python scripts/convert_covers.py
      - name: בדיקת תקינות
        run: python scripts/build.py
      - name: עדכון books.json והכריכות (רק ב-main)
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain books.json covers)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A books.json covers
            git commit -m "chore: המרת כריכות ועדכון אוטומטי של books.json"
            git pull --rebase origin main
            git push
          fi